<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist — home base</title>
<!-- ═══════════════════════════════════════════════════════════════════════
     ARTIST HUB — own your audience, get paid direct. Replaces Linktree +
     Spotify-for-Artists + Patreon + Meta reach. Music, tip jar, merch, mailing
     list, gigs — every link routes to the ARTIST. They own the fans, keep 100%.
     Edit CONFIG, deploy free. Part of the Free Music Stack (MIT).
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
  :root{--brand:#8b5cf6;--bg:#0b0a12;--card:#161422;--line:#282438;--ink:#f2effc;--dim:#a89ec6}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
       background:radial-gradient(900px 500px at 50% -10%,#221a3d,var(--bg));min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:1.3rem}
  header{text-align:center;padding:1rem 0}
  .avatar{width:110px;height:110px;border-radius:50%;background:#2a2440 center/cover;margin:0 auto .7rem;display:grid;place-items:center;font-size:2.6rem;border:3px solid var(--brand)}
  h1{font-size:1.8rem;margin:.2rem 0}
  .bio{color:var(--dim)}
  .genre{display:inline-block;margin-top:.5rem;font-size:.8rem;font-weight:700;color:var(--brand);border:1px solid var(--brand);border-radius:99px;padding:.3rem .9rem}
  .block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem;margin-top:1rem}
  .block h2{font-family:sans-serif;font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:0 0 .7rem}
  a.link{display:flex;align-items:center;gap:.7rem;background:#1e1a30;border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;text-decoration:none;color:var(--ink);font-weight:600;margin:.4rem 0;transition:.15s}
  a.link:hover{border-color:var(--brand);transform:translateX(3px)}
  a.link .ar{margin-left:auto;color:var(--dim)}
  .tips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}
  .tips a{flex:1;min-width:64px;text-align:center;background:var(--brand);color:#0b0a12;text-decoration:none;font-weight:800;padding:.6rem;border-radius:10px}
  .gig{border-left:2px solid var(--brand);padding:.2rem 0 .2rem .8rem;margin:.5rem 0}
  .gig b{display:block} .gig span{color:var(--dim);font-size:.88rem}
  form{display:flex;gap:.5rem;margin-top:.3rem}
  form input{flex:1;padding:.7rem;border-radius:10px;border:1px solid var(--line);background:#1e1a30;color:var(--ink)}
  form button{background:var(--brand);color:#0b0a12;border:0;border-radius:10px;padding:.7rem 1rem;font-weight:800;cursor:pointer}
  .own{color:var(--dim);font-size:.78rem;text-align:center;margin-top:.4rem}
  footer{text-align:center;color:var(--dim);font-size:.76rem;padding:1.6rem 0}
  footer a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
<script>
// ═══ CONFIG — one per artist ═══
const A = {
  name: "The Artist",
  bio: "Self-taught singer-songwriter from Preston.",
  genre: "indie · folk",
  accent: "#8b5cf6",
  photo: "",                                  // url or "" for emoji
  // MUSIC — direct links (their own site / Bandcamp — where they keep the money, not Spotify's $0.003)
  music: [
    { label:"Listen / buy on Bandcamp", url:"https://bandcamp.com/", icon:"🎧" },
    { label:"Latest single", url:"https://", icon:"🎵" },
  ],
  // TIP JAR — Stripe/PayPal links, straight to the artist, keep 100%
  tips: [ ["$5","https://"], ["$10","https://"], ["$20","https://"], ["Name your price","https://"] ],
  merchUrl: "",            // link to their artist-merch page ("" hides it)
  gigs: [
    { title:"The Demo Hotel — open mic", when:"Tue 12 Aug · 7:30pm" },
  ],
  socials: [ ["Instagram","https://instagram.com/"], ["YouTube","https://youtube.com/"] ],
  // MAILING LIST — set to your OWN list form (Buttondown/Listmonk/Google Form/Formspree).
  // Leave "" to fall back to a mailto. You own this list — not Instagram, not Meta.
  mailingListAction: "",
  mailingListEmail: "you@example.com",
};
// ═══ end config ═══
</script>

<header>
  <div class="avatar" id="av">🎤</div>
  <h1 id="nm"></h1>
  <div class="bio" id="bio"></div>
  <div class="genre" id="genre"></div>
</header>

<div class="block"><h2>🎵 Music</h2><div id="music"></div></div>
<div class="block"><h2>💜 Support me direct — I keep 100%</h2><div class="tips" id="tips"></div>
  <div id="merch"></div></div>
<div class="block" id="gigblock"><h2>📅 Upcoming</h2><div id="gigs"></div></div>
<div class="block"><h2>✉️ My mailing list (I own this, not the algorithm)</h2>
  <form id="mlForm"><input id="ml" type="email" placeholder="your email" required><button>Join</button></form>
  <div class="own">Straight to me. No platform gatekeeping who hears from me.</div>
</div>
<div class="block"><h2>🔗 Elsewhere</h2><div id="socials"></div></div>

<footer>Own your audience. Get paid direct. Free artist hub by
  <a href="https://openmic.techduinn.dpdns.org">openmic / Free Music Stack</a>.</footer>

<script>
document.documentElement.style.setProperty('--brand', A.accent);
document.title = A.name + " — home base";
nm.textContent=A.name; bio.textContent=A.bio; genre.textContent=A.genre;
if(A.photo){ av.style.backgroundImage=`url('${A.photo}')`; av.textContent=''; }
const linkRow=(l,u,ic)=>`<a class="link" href="${u}"><span>${ic||'🔗'}</span><span>${l}</span><span class="ar">→</span></a>`;
music.innerHTML = A.music.map(m=>linkRow(m.label,m.url,m.icon)).join('');
tips.innerHTML = A.tips.map(t=>`<a href="${t[1]}">${t[0]}</a>`).join('');
merch.innerHTML = A.merchUrl ? linkRow("Merch — buy direct", A.merchUrl, "🎽") : '';
gigs.innerHTML = A.gigs.length ? A.gigs.map(g=>`<div class="gig"><b>${g.title}</b><span>${g.when}</span></div>`).join('') : '<span style="color:var(--dim)">No gigs listed</span>';
if(!A.gigs.length) gigblock.style.display='none';
socials.innerHTML = A.socials.map(s=>linkRow(s[0],s[1],'↗')).join('');
const f=document.getElementById('mlForm');
if(A.mailingListAction){ f.action=A.mailingListAction; f.method='post'; document.getElementById('ml').name='email'; }
else f.onsubmit = e=>{ e.preventDefault(); location.href=`mailto:${A.mailingListEmail}?subject=Add me to your list&body=${encodeURIComponent(document.getElementById('ml').value)}`; };
</script>
</div>
</body>
</html>
