<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tell us what works & what doesn't — feedback</title>
<meta name="description" content="Help make the Free Music Stack better. Tell us what worked, what's broken, and what to build next.">
<meta name="theme-color" content="#7C5CFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b0a12'/%3E%3Ctext x='50' y='72' font-size='56' text-anchor='middle'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<style>
  :root{--violet:#7C5CFF;--bg:#0a0910;--card:#151222;--card2:#1a1630;--line:#2a2542;--ink:#f3f1fb;--dim:#a49cc4;--good:#3ecf8e;--bad:#ff8a6a}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;color:var(--ink);
       background:radial-gradient(900px 560px at 50% -12%,#241a4a,transparent),var(--bg)}
  .wrap{max-width:560px;margin:0 auto;padding:2.2rem 1.1rem 3.5rem}
  header{text-align:center;margin-bottom:1.2rem}
  .mark{font-size:2.3rem}
  h1{font-size:1.9rem;letter-spacing:-.4px;margin:.4rem 0 .2rem}
  .lede{color:var(--dim);max-width:42ch;margin:.3rem auto 0}
  form{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:1.3rem;margin-top:1.2rem}
  label{display:block;font-weight:700;margin:1rem 0 .3rem}
  label .em{margin-right:.4rem}
  .hint{color:var(--dim);font-size:.82rem;font-weight:400;display:block;margin-top:.1rem}
  input,textarea,select{width:100%;background:#0d0b18;border:1px solid var(--line);border-radius:10px;padding:.7rem;color:var(--ink);font:inherit}
  textarea{min-height:80px;resize:vertical}
  label:first-of-type{margin-top:0}
  button{width:100%;margin-top:1.1rem;background:var(--violet);color:#fff;border:0;border-radius:12px;padding:.85rem;
         font-weight:800;font-size:1.02rem;cursor:pointer}
  .good b{color:var(--good)} .bad b{color:var(--bad)}
  footer{text-align:center;color:var(--dim);font-size:.8rem;margin-top:1.8rem} footer a{color:var(--violet)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">💬</div>
    <h1>What worked? What didn't?</h1>
    <p class="lede">This is built by one bloke and given away free. The only way it gets better is you telling me the truth. No sugar-coating needed.</p>
  </header>

  <form id="f">
    <label for="tool">Which part? <span class="hint">Optional</span></label>
    <select id="tool">
      <option value="">The whole thing / not sure</option>
      <option>Venue site</option><option>Ticketing</option><option>Music player</option>
      <option>Artist hub</option><option>Merch</option><option>Loyalty</option>
      <option>What's-on calendar</option><option>Open-mic sign-up</option>
      <option>Help / support page</option><option>The website / one-stop shop</option>
    </select>

    <label class="good" for="good"><span class="em">✅</span>What worked <span class="hint">What did you like, what was easy?</span></label>
    <textarea id="good" maxlength="600" placeholder="Be honest — what's good?"></textarea>

    <label class="bad" for="bad"><span class="em">🔧</span>What didn't <span class="hint">Bugs, confusing bits, what annoyed you?</span></label>
    <textarea id="bad" maxlength="600" placeholder="Be honest — what's broken or clunky?"></textarea>

    <label for="wish"><span class="em">💡</span>What should we build next? <span class="hint">Optional</span></label>
    <textarea id="wish" maxlength="400" placeholder="Your wish list..."></textarea>

    <label for="who">Your name / email <span class="hint">Optional — only if you want a reply</span></label>
    <input id="who" maxlength="120" placeholder="So I can thank you or follow up">

    <button type="submit">💬 Send feedback</button>
  </form>

  <footer>⚓ Tech Duinn · thank you for helping ·
    <a href="https://donn-duinn.github.io/free-music-stack/">the free tools</a></footer>
</div>

<script>
const FB_EMAIL = "donn-duinn@agentmail.to";
document.getElementById('f').addEventListener('submit', e=>{
  e.preventDefault();
  const g=id=>(document.getElementById(id).value||'').trim();
  if(!g('good') && !g('bad') && !g('wish')){ alert('Add a line in at least one box, then send.'); return; }
  const body=`Feedback on the Free Music Stack:%0D%0A%0D%0APart: ${encodeURIComponent(g('tool')||'whole thing')}%0D%0A%0D%0AWORKED: ${encodeURIComponent(g('good'))}%0D%0A%0D%0ADIDN'T: ${encodeURIComponent(g('bad'))}%0D%0A%0D%0AWISH: ${encodeURIComponent(g('wish'))}%0D%0A%0D%0AFrom: ${encodeURIComponent(g('who'))}`;
  window.location.href=`mailto:${FB_EMAIL}?subject=${encodeURIComponent('Feedback: '+(g('tool')||'the stack'))}&body=${body}`;
});
</script>
</body>
</html>
