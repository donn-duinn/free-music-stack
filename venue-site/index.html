<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venue — live music, menus & local art</title>
<!-- ═══════════════════════════════════════════════════════════════════════
     FREE MUSIC-VENUE SITE — by a Melbourne musician, given away under open licence.
     One page: live music / open-mic sign-up + drinks + food + a LOCAL ART WALL
     where patrons buy the art they see hanging in the venue (links to the artist).
     Clone per venue, edit ONLY the CONFIG block below, deploy free on Cloudflare:
        npx wrangler pages deploy .
     Powered by openmic — https://openmic.techduinn.dpdns.org
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
  :root{--brand:#c9a24b;--bg:#100f0d;--card:#1b1815;--line:#332e28;--ink:#f3ede2;--dim:#b3a795}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.6 Georgia,serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:820px;margin:0 auto;padding:0 1rem}
  header{position:sticky;top:0;z-index:9;background:#100f0de6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;max-width:820px;margin:0 auto;flex-wrap:wrap}
  .logo{font-family:sans-serif;font-weight:800;letter-spacing:.5px;color:var(--brand);font-size:1.1rem}
  nav{margin-left:auto;display:flex;gap:.9rem;font-family:sans-serif;font-size:.85rem}
  nav a{color:var(--dim);text-decoration:none} nav a:hover{color:var(--ink)}
  a.cta{background:var(--brand);color:#100f0d;text-decoration:none;font-family:sans-serif;font-weight:800;padding:.45rem .8rem;border-radius:8px;font-size:.85rem}
  .hero{text-align:center;padding:3rem 1rem 2rem}
  .hero h1{font-size:2.5rem;margin:.2rem 0} .hero .tag{color:var(--dim);font-size:1.15rem}
  .hero .night{display:inline-block;margin-top:1rem;font-family:sans-serif;font-weight:700;color:var(--brand);border:1px solid var(--brand);border-radius:99px;padding:.4rem 1.1rem}
  section{padding:1.7rem 0;border-top:1px solid var(--line);scroll-margin-top:64px}
  h2{font-family:sans-serif;font-size:1.35rem;color:var(--brand);margin:0 0 .8rem}
  .ev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:.6rem 0}
  .signup{background:var(--brand);color:#100f0d;text-decoration:none;font-family:sans-serif;font-weight:800;display:inline-block;margin-top:.6rem;padding:.55rem 1rem;border-radius:8px}
  .menu{columns:2;column-gap:2.2rem}@media(max-width:540px){.menu{columns:1}}
  .mcat{break-inside:avoid;margin-bottom:1.1rem}
  .mcat h3{font-family:sans-serif;font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:.3rem}
  .row{display:flex;justify-content:space-between;gap:1rem;padding:.22rem 0}.row .p{color:var(--brand);white-space:nowrap}
  .row small{color:var(--dim);display:block;font-size:.8rem}
  /* ART WALL */
  .art{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
  .piece{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .piece .img{aspect-ratio:1;background:#26221d center/cover no-repeat;display:grid;place-items:center;color:var(--dim);font-family:sans-serif;font-size:.8rem}
  .piece .body{padding:.7rem}
  .piece .t{font-weight:700} .piece .by{color:var(--dim);font-size:.85rem;font-family:sans-serif}
  .piece .buy{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem}
  .piece .buy a{background:var(--brand);color:#100f0d;text-decoration:none;font-family:sans-serif;font-weight:800;font-size:.8rem;padding:.35rem .7rem;border-radius:7px}
  .piece .price{color:var(--brand);font-family:sans-serif;font-weight:700}
  .artnote{color:var(--dim);font-size:.92rem;margin-bottom:1rem}
  .info{display:flex;flex-wrap:wrap;gap:1.5rem;color:var(--dim);font-family:sans-serif;font-size:.95rem}
  footer{text-align:center;color:var(--dim);font-family:sans-serif;font-size:.8rem;padding:2rem 1rem}
  footer a{color:var(--brand)}
</style>
</head>
<body>
<script>
// ═══ CONFIG — edit per venue; everything else renders automatically ═══
const V = {
  name: "The Demo Hotel",
  tagline: "Preston's home for live music & local art",
  accent: "#c9a24b",
  night: "🎤 Open mic every Tuesday · 7pm",
  phone: "03 0000 0000",
  address: "123 High St, Preston VIC 3072",
  hours: "Wed–Sun · 4pm–late",
  socials: { instagram:"https://instagram.com/", facebook:"https://facebook.com/" },
  openmicSignup: "https://openmic.techduinn.dpdns.org/demo",

  events: [
    { title:"Open Mic Night", when:"Every Tuesday · 7pm sign-up, 7:30 start",
      blurb:"Musicians, comedy, spoken word — all welcome, free entry. Sign up online, no inbox scramble." },
  ],

  drinks: [
    { cat:"On tap", items:[["Local lager","$9"],["Pale ale","$10"],["Cider","$10"],["Guinness","$11"]] },
    { cat:"Cocktails", items:[["Negroni","$18"],["Espresso Martini","$19"],["Old Fashioned","$20"]] },
    { cat:"Wine", items:[["House red / white","$9 gl"],["Prosecco","$12 gl"]] },
    { cat:"Non-alc", items:[["Soft drinks","$5"],["Mocktail of the day","$12"],["Coffee","$5"]] },
  ],

  food: [
    { cat:"Snacks", items:[["Bowl of chips","$10"],["Mixed olives","$8"],["Garlic bread","$9"]] },
    { cat:"Mains", items:[["Parma","$24"],["Beef burger + chips","$22"],["Veggie bowl","$20"]] },
    { cat:"Share", items:[["Grazing board","$32"],["Wings (12)","$18"]] },
  ],

  // LOCAL ART WALL — the art hanging in the venue, patrons buy direct from the artist.
  art: [
    { title:"Northside Nights", artist:"Ana R.", price:"$220", img:"", buy:"https://instagram.com/" },
    { title:"High St Blue", artist:"Jordan M.", price:"$150", img:"", buy:"https://instagram.com/" },
    { title:"Tram Line 86", artist:"Sam K.", price:"$300", img:"", buy:"https://instagram.com/" },
  ],
  artBlurb: "Every piece on our walls is by a local artist and it's for sale — tap 'Buy' to go straight to the artist. Support the people who make this place look like this.",
};
// ═══ end config ═══
</script>

<header><div class="bar">
  <span class="logo" id="logo"></span>
  <nav>
    <a href="#music">Music</a><a href="#drinks">Drinks</a><a href="#food">Food</a><a href="#art">Art</a><a href="#find">Find us</a>
  </nav>
  <a class="cta" id="cta">Sign up to play</a>
</div></header>

<div class="wrap">
  <div class="hero"><h1 id="hname"></h1><div class="tag" id="htag"></div><div class="night" id="hnight"></div></div>

  <section id="music"><h2>What's on</h2><div id="evs"></div></section>
  <section id="drinks"><h2>Drinks</h2><div class="menu" id="mdrinks"></div></section>
  <section id="food"><h2>Food</h2><div class="menu" id="mfood"></div></section>
  <section id="art"><h2>Local art — on the walls, for sale</h2><div class="artnote" id="artblurb"></div><div class="art" id="artwall"></div></section>
  <section id="find"><h2>Find us</h2><div class="info"><div id="addr"></div><div id="hrs"></div><div id="ph"></div></div></section>
</div>

<footer>
  <div id="soc"></div>
  Free site, menus, open-mic sign-ups & local-art wall — a gift to Melbourne venues, powered by
  <a href="https://openmic.techduinn.dpdns.org">openmic</a>. Open licence, built by a local musician.
</footer>

<script>
// only allow safe link schemes — a pasted artist/staff link can't become javascript:/data: code
const safeUrl=u=>/^(https?:|mailto:|tel:|\/|#)/i.test(String(u||'').trim())?u:'#';
const menu = arr => arr.map(c=>`<div class="mcat"><h3>${c.cat}</h3>${
  c.items.map(i=>`<div class="row"><span>${i[0]}</span><span class="p">${i[1]}</span></div>`).join('')}</div>`).join('');
document.documentElement.style.setProperty('--brand', V.accent);
document.title = V.name + " — live music, menus & local art";
logo.textContent = V.name; hname.textContent = V.name; htag.textContent = V.tagline;
hnight.textContent = V.night; cta.href = safeUrl(V.openmicSignup);
addr.innerHTML="📍 "+V.address; hrs.innerHTML="🕑 "+V.hours; ph.innerHTML="📞 "+V.phone;
evs.innerHTML = V.events.map(e=>`<div class="ev"><b style="font-size:1.1rem">${e.title}</b><br>
  <span style="color:var(--dim)">${e.when}</span><p>${e.blurb}</p>
  <a class="signup" href="${safeUrl(V.openmicSignup)}">Sign up to perform →</a></div>`).join('');
mdrinks.innerHTML = menu(V.drinks); mfood.innerHTML = menu(V.food);
artblurb.textContent = V.artBlurb;
artwall.innerHTML = V.art.map(a=>`<div class="piece">
  <div class="img" style="${a.img?`background-image:url('${a.img}')`:''}">${a.img?'':'🖼️'}</div>
  <div class="body"><div class="t">${a.title}</div><div class="by">by ${a.artist}</div>
    <div class="buy"><span class="price">${a.price}</span><a href="${safeUrl(a.buy)}">Buy →</a></div></div></div>`).join('');
soc.innerHTML = Object.entries(V.socials).map(([k,u])=>`<a href="${safeUrl(u)}" style="color:var(--dim)">${k}</a>`).join(' · ');
</script>
</body>
</html>
